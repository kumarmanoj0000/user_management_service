# JWT Configuration
jwt.secret=YourJWTSecretKeyNeedsToBeLongAndSecureAndAtLeast256BitsLongForHS512
jwt.expiration.ms=3600000

# H2 Console (Optional, for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # Be careful with this in production, use 'validate' or flyway/liquibase

